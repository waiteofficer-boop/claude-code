// legenda karaokê

  s += `<path d="M120 1300 L960 1300 L1100 2000 L-20 2000Z" fill="#6b4a30" stroke="${INK}" stroke-width="10"/>`;
  s += `<path d="M330 1120 Q540 1000 750 1120 L800 1320 L280 1320Z" fill="#1d1c1e" stroke="${INK}" stroke-width="8"/><circle cx="540" cy="1220" r="80" fill="#e8e0d0" stroke="${INK}" stroke-width="6"/>`;
  for (let i = 0; i < 10; i++) { const a = (i / 10) * Math.PI * 1.6 + 2.2; s += `<circle cx="${f1(540 + 55 * Math.cos(a))}" cy="${f1(1220 + 55 * Math.sin(a))}" r="11" fill="#1d1c1e"/>`; }
  const hy = lerp(780, 1080, hang), hr = lerp(-28, 0, hang);
  s += g(`translate(540,${f1(hy)}) rotate(${f1(hr)})`, `<path d="M-260 -40 Q0 -90 260 -40 L240 40 Q0 0 -240 40Z" fill="#1d1c1e" stroke="${INK}" stroke-width="8"/><path d="M-300 -60 a70 60 0 1 0 100 110Z M300 -60 a70 60 0 1 1 -100 110Z" fill="#1d1c1e" stroke="${INK}" stroke-width="8"/>` +
    g('translate(120,-30)', `<path d="M0 0 Q80 -90 160 -60 L220 40 Q120 90 20 60Z" fill="#e2b48a" stroke="${INK}" stroke-width="6"/><path d="M140 -70 L280 -160 L340 -60 L210 30Z" fill="#7a6a4a" stroke="${INK}" stroke-width="6"/>`));
  if (hang > .9) s += `<path d="M540 1000 l-30 -40 M560 990 l0 -50 M580 1000 l30 -40" stroke="#fff" stroke-width="7" stroke-linecap="round"/>`;
  const z = lerp(1.05, 1.25, E.io(clamp(lt / 2)));
  return camWrap(s, 540, lerp(1040, 1000, clamp(lt / 2)), z) + card('“DON’T WORRY', 'ABOUT IT.”', t, S('s11') - .05, wt('s11', 'about'), 540, 480, 70, S('s12') - .15);
}
function s2_cockpit(lt, t) {
  const [hx, hy] = shake(t, 3, 17);
  let view = `<rect x="0" y="0" width="1080" height="1920" fill="url(#morning)"/><path d="M0 760 Q540 700 1080 760 L1080 1920 L0 1920Z" fill="#4f8a9a"/>`;
  view += `<path d="M260 820 Q540 760 820 820 Q880 900 800 960 Q540 1010 280 960 Q200 900 260 820Z" fill="#7e9a56" stroke="${INK}" stroke-width="5"/><path d="M430 860 Q480 830 540 850 Q590 880 540 910 Q470 920 430 860Z" fill="#87a35c" stroke="${INK}" stroke-width="4"/>`;
  for (let i = 0; i < 4; i++) view += `<rect x="${600 + i * 14}" y="${860 + i * 10}" width="10" height="30" fill="#878a91" stroke="${INK}" stroke-width="2" transform="rotate(-20 ${600 + i * 14} ${860 + i * 10})"/>`;
  const vz = lerp(1, 1.3, clamp(lt / 3));
  let s = `<g clip-path="url(#windshield)">${g(`translate(540,880) scale(${vz.toFixed(3)}) translate(-540,-880)`, view)}</g>`;
  s += `<path d="M90 300 L990 300 L1040 1150 L40 1150Z M540 300 L540 1150 M60 700 L1020 700" fill="none" stroke="#3a3a32" stroke-width="22"/>`;
  s += `<path d="M0 1150 L1080 1150 L1080 1920 L0 1920Z" fill="#3c3a30" stroke="${INK}" stroke-width="8"/>`;
  for (let i = 0; i < 5; i++) s += `<circle cx="${180 + i * 180}" cy="1300" r="62" fill="#1d1c1a" stroke="${INK}" stroke-width="6"/><line x1="${180 + i * 180}" y1="1300" x2="${f1(180 + i * 180 + 45 * Math.cos(t * (1 + i * .3) + i))}" y2="${f1(1300 + 45 * Math.sin(t * (1 + i * .3) + i))}" stroke="#e8e0d0" stroke-width="5"/>`;
  s += `<path d="M300 1920 Q300 1460 540 1420 Q780 1460 780 1920Z" fill="#3a3326" stroke="${INK}" stroke-width="8"/><path d="M380 1560 Q540 1380 700 1560 Q700 1460 540 1420 Q380 1460 380 1560Z" fill="#5a4a32" stroke="${INK}" stroke-width="6"/>`;
  const key = [0, .5, 1.0].some(k => lt > k + .2 && lt < k + .45);
  s += g(`translate(870,1680)`, `<rect x="-90" y="0" width="180" height="40" fill="#2a2a28" stroke="${INK}" stroke-width="5"/><path d="M-60 ${key ? -6 : -20} L80 ${key ? -6 : -20}" stroke="#8a6a40" stroke-width="18" stroke-linecap="round"/><path d="M40 ${key ? -60 : -76} q50 -30 90 10 l-20 40 q-40 0 -70 -20z" fill="#d8b48a" stroke="${INK}" stroke-width="5"/>`);
  return g(`translate(${f1(hx)},${f1(hy)})`, s) + italic('“to… to… to…”', 540, 1380, t, S('s14') + .2, 52) + label('ATTACK', 540, 560, t, wt('s14', 'attack'), -3, 56);
}
function s2_tora(lt, t) {
  const ts = [S('s15') + .02, wt('s15', 'tora', 1), wt('s15', 'tora', 2)];
  let s = `<rect width="1080" height="1920" fill="#1a0f12"/>` + glowDot(540, 900, 700, .25, 'glR');
  for (let i = 0; i < 6; i++) { const r = ((t * 220 + i * 160) % 960); s += `<circle cx="540" cy="900" r="${f1(r)}" fill="none" stroke="#ffb070" stroke-width="5" opacity="${(.35 * (1 - r / 960)).toFixed(2)}"/>`; }
  let sh = 0;
  ts.forEach((tt, i) => { if (t < tt) return; const sc = popS(t, tt, .25); sh = Math.max(sh, Math.exp(-(t - tt) * 9)); s += g(`translate(540,${720 + i * 240}) scale(${sc.toFixed(3)})`, `<text x="0" y="0" text-anchor="middle" font-family="CSC" font-size="190" fill="#fffaf0" letter-spacing="10" filter="url(#glow)">TORA!</text>`); });
  const [hx, hy] = shake(t, 18 * sh, 50);
  return g(`translate(${f1(hx)},${f1(hy)})`, s) + italic('surprise achieved', 540, 1300, t, Ee('s15') - .2, 48);
}
function s2_message(lt, t) {
  const lines = ['FROM: CINCPAC', 'TO: ALL SHIPS', '', 'AIR RAID PEARL HARBOR X', 'THIS IS NOT DRILL'];
  const t0 = wt('s16', 'air') - (wt('s16', 'message') - .1) - .1, chars = Math.floor(Math.max(0, lt - .3) * 9) + (lt > t0 ? 40 : 0);
  let s = `<rect x="-300" y="-300" width="1680" height="2520" fill="#2a2420"/><rect x="140" y="440" width="800" height="960" fill="url(#paper)" stroke="${INK}" stroke-width="6" transform="rotate(-2 540 920)"/>`;
  s += g('rotate(-2 540 920)', `<text x="540" y="540" text-anchor="middle" font-family="CSC" font-size="44" fill="#6b4a2e">NAVAL MESSAGE</text><path d="M200 570 H880" stroke="#6b4a2e" stroke-width="4"/>` + typedPaper(lines.slice(0, 2), Math.min(chars, 26), 200, 660, 42, 70) + (lt > t0 ? typedPaper(lines.slice(3), Math.floor((lt - t0) * 14), 200, 900, 54, 100) : ''));
  const z = lerp(1.0, 1.22, E.io(clamp(lt / 5)));
  return camWrap(s, 540, lerp(900, 980, clamp(lt / 5)), z) ;
}

// ═════════════════════════ LISTA DE PLANOS ═════════════════════════
const SHOTS = [];
function shot(kind, t0, f, name) { SHOTS.push({ kind, t0, f, name }); }
shot('3d', 0, sh_ocean, 'ocean');
shot('25d', S('s2') - .15, sh_oahuNight, 'oahu-night');
shot('25d', S('s3') + .05, sh_condor, 'condor');
shot('2d', wt('s3', 'periscope') - .25, s2_binoc, 'binoculars');
shot('2d', S('s4') - .05, s2_map, 'map');
shot('3d', wt('s4', 'six') - .1, sh_fleet, 'fleet');
shot('3d', S('s5') - .05, sh_deck, 'deck');
shot('3d', wt('s5', 'one') - .15, sh_formation, 'formation');
shot('25d', S('s6') - .05, sh_ward, 'ward');
shot('2d', wt('s6', 'fires') - .05, s2_gun, 'gun');
shot('25d', wt('s6', 'first') - .2, sh_splash, 'splash');

shot('2d', wt('s8', 'sees') - .05, s2_scope, 'scope');

shot('3d', S('s12') - .1, sh_clouds, 'clouds');
shot('3d', S('s13') - .1, sh_harbor, 'harbor');
shot('25d', wt('s13', 'sailors') - .1, sh_colors, 'colors');
shot('2d', S('s14') - .1, s2_cockpit, 'cockpit');
shot('2d', S('s15') - .25, s2_tora, 'tora');
shot('3d', Ee('s15') + .25, sh_dive, 'dive');
shot('2d', wt('s16', 'message') - .1, s2_message, 'message');
SHOTS.forEach((s, i) => s.t1 = SHOTS[i + 1] ? SHOTS[i + 1].t0 : TL.duration);
CLOCKS = [
  { t: S('s3') + .2, label: '3:42 AM', h: 3, m: 42 },
  { t: wt('s5', 'six'), label: '6:00 AM', h: 6, m: 0 },
  { t: wt('s6', 'six'), label: '6:45 AM', h: 6, m: 45 },
  { t: wt('s8', 'seven'), label: '7:02 AM', h: 7, m: 2 },
  { t: wt('s12', 'seven'), label: '7:40 AM', h: 7, m: 40 },
  { t: wt('s14', 'seven'), label: '7:49 AM', h: 7, m: 49 },
  { t: Ee('s15') + .3, label: '7:55 AM', h: 7, m: 55 },
  { t: wt('s16', 'seven'), label: '7:58 AM', h: 7, m: 58 },
];
CLOCKS.forEach((c, i) => c.until = CLOCKS[i + 1] ? CLOCKS[i + 1].t : TL.duration);
CLOCKS[0].until = S('s4') - .05; // 3:42 não vale para a cena da frota (≈ 6h)
// sobreposições por plano (texto em tela)
function overlays(t) {
  return title(['DECEMBER 7', '1941'], 540, 760, t, S('s1') - .1, Ee('s1') + .6, 120) +
    (t < S('s3') ? tag('OAHU, HAWAII', t, S('s2') + .2) : '') +

    label('183 PLANES', 540, 640, t, wt('s5', 'eighty'), -3, 52, S('s6') - .1) +
    card('THE FIRST AMERICAN SHOTS', 'OF THE PACIFIC WAR', t, wt('s6', 'first') - .1, wt('s6', 'shots'), 540, 520, 54, S('s7') - .15) +
    label('OPANA POINT RADAR', 540, 560, t, wt('s8', 'radar'), -3, 44, wt('s8', 'sees') - .1) +
    label('EXPECTED: B-17s FROM CALIFORNIA', 540, 1250, t, wt('s10', 'american'), 2, 36, S('s11') - .1) +
    label('BATTLESHIP ROW', 540, 560, t, wt('s13', 'eight'), -3, 50, wt('s13', 'sailors') - .1) +
    label('MORNING COLORS · 8:00', 540, 1250, t, wt('s13', 'colors'), 3, 40, S('s14') - .1);
}

// ═════════════════════════ montagem do quadro ═════════════════════════
const BUILT = {};
const svg = document.getElementById('v');
function renderAt(t) {
  let sh = SHOTS[0]; for (const s of SHOTS) if (t >= s.t0) sh = s;
  const lt = t - sh.t0;
  let out = DEFS;
  if (sh.kind === '2d') { canvas.style.visibility = 'hidden'; out += sh.f(lt, t); }
  else {
    canvas.style.visibility = 'visible';
    const st = BUILT[sh.name] || (BUILT[sh.name] = sh.f());
    st.update(lt, t); R.render(st.sc, st.c);
  }
  out += overlays(t);
  out += `<rect width="1080" height="1920" fill="url(#vig)"/>`;
  out += `<image href="${GRAIN[Math.floor(t * 12.5) % 4]}" x="0" y="0" width="1080" height="1920" preserveAspectRatio="none" opacity=".07" style="mix-blend-mode:overlay"/>`;
  out += bars(t) + clockBadge(t) + subtitle(t);
  // entrada de cada plano: 3 quadros de "dip" para preto (corte seco suavizado)
  const cutIn = clamp((t - sh.t0) / .12);
  if (sh.t0 > 0 && cutIn < 1) out += `<rect width="1080" height="1920" fill="#000" opacity="${(.55 * (1 - cutIn)).toFixed(3)}"/>`;
  const fin = Math.min(prog(t, 0, .8), 1 - prog(t, TL.duration - 1.6, 1.6));
  if (fin < 1) out += `<rect width="1080" height="1920" fill="#000" opacity="${(1 - fin).toFixed(3)}"/>`;
  svg.innerHTML = out;
}
function collectSFX() {
  const sh = n => SHOTS.find(s => s.name === n), span = n => [sh(n).t0, sh(n).t1 - sh(n).t0];
  SHOTS.slice(1).forEach(s => sfx('cut', s.t0));
  sfx('waves', 0, sh('binoculars').t1); sfx('crickets', ...span('oahu-night')); sfx('drone', ...span('condor'));
  sfx('wind', ...span('map')); sfx('waves', sh('fleet').t0, sh('formation').t0 - sh('fleet').t0); sfx('wind', ...span('fleet'));
  sfx('engines', sh('deck').t0, sh('ward').t0 - sh('deck').t0);
  sfx('waves', sh('ward').t0, sh('teletype').t0 - sh('ward').t0);
  sfx('boom', sh('gun').t0 + .02); sfx('boom', sh('gun').t0 + .77); sfx('splash', sh('splash').t0 + .05);
  sfx('teletype', ...span('teletype'));
  sfx('wind', ...span('radar')); sfx('radarhum', sh('radar').t0, sh('info-center').t0 - sh('radar').t0);
  for (let k = 0; k < 4; k++) sfx('ping', sh('scope').t0 + .2 + k * .9);
  sfx('roomtone', sh('info-center').t0, sh('clouds').t0 - sh('info-center').t0);
  sfx('ring', sh('info-center').t0 + .3); sfx('click', sh('phone').t0 + 1.75);
  sfx('engines', sh('clouds').t0, sh('harbor').t0 - sh('clouds').t0 + .5); sfx('wind', ...span('clouds'));
  sfx('waves', sh('harbor').t0, sh('cockpit').t0 - sh('harbor').t0); sfx('bugle', sh('colors').t0 + .6);
  sfx('engines', ...span('cockpit')); [0, .5, 1.0].forEach(k => sfx('morse', sh('cockpit').t0 + k + .2));
  [S('s15') + .02, wt('s15', 'tora', 1), wt('s15', 'tora', 2)].forEach(x => sfx('impact', x));
  sfx('dive', sh('dive').t0, sh('dive').t1 - sh('dive').t0); sfx('siren', sh('dive').t0 + .8, TL.duration - sh('dive').t0 - .8);
  sfx('teletype', sh('message').t0, 2.5); sfx('impact', wt('s16', 'air'));
  for (let k = 0; S('s3') + k < TL.duration - 2; k++) sfx('tock', S('s3') + k);
  return SFX;
}
window.renderAt = renderAt; window.getSFX = collectSFX; window.DURATION = TL.duration;
window.SHOTLIST = () => SHOTS.map(s => ({ name: s.name, kind: s.kind, t0: +s.t0.toFixed(2), t1: +s.t1.toFixed(2) }));
if (!/render/.test(location.search)) {
  document.body.classList.add('preview');
  const st = document.getElementById('stage'); st.style.transform = `scale(${innerHeight / 1920})`;
  const a = new Audio('build/mix_en.m4a'); let t0 = null;
  document.body.onclick = () => { a.currentTime = 0; a.play().catch(() => {}); t0 = performance.now(); };
  const loop = now => { if (t0 == null) t0 = now; renderAt(((now - t0) / 1000) % TL.duration); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
