<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>O Estopim — Sarajevo, 1914</title>
<style>
@font-face{font-family:TYPE;src:url(fonts/SpecialElite.ttf)}
@font-face{font-family:CSC;src:url(fonts/CormorantSC.ttf)}
@font-face{font-family:EBG;src:url(fonts/EBGaramond.ttf)}
@font-face{font-family:EBGI;src:url(fonts/EBGaramond-Italic.ttf)}
html,body{margin:0;background:#000;overflow:hidden}
#stage{position:relative;width:1080px;height:1920px}
#gl,#v{position:absolute;left:0;top:0;width:1080px;height:1920px}
</style>
<script src="node_modules/three/build/three.min.js"></script>
<script src="timeline_pt.js"></script>
<script src="mapdata.js"></script>
</head>
<body>
<div id="stage"><canvas id="gl" width="1080" height="1920"></canvas><svg id="v" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"></svg></div>
<script>
'use strict';
// ═════════════ utilidades ═════════════
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), lerp = (a, b, t) => a + (b - a) * t, f1 = n => (+n).toFixed(1);
const E = { lin: t => t, io: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2, out: t => 1 - Math.pow(1 - t, 3), in: t => t * t * t, sine: t => -(Math.cos(Math.PI * t) - 1) / 2,
  back: t => { const c1 = 1.7, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); } };
function kf(t, keys) { if (t <= keys[0][0]) return keys[0][1]; for (let i = 1; i < keys.length; i++) if (t <= keys[i][0]) { const [t0, v0] = keys[i - 1], [t1, v1, e] = keys[i], p = E[e || 'sine']((t - t0) / Math.max(1e-6, t1 - t0)); return Array.isArray(v0) ? v0.map((a, j) => lerp(a, v1[j], p)) : lerp(v0, v1, p); } return keys[keys.length - 1][1]; }
const prog = (t, t0, d) => clamp((t - t0) / d), popS = (t, t0, d = .3) => { const p = prog(t, t0, d); return p <= 0 ? 0 : E.back(p); };
function rnd(i) { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
const g = (tr, s, extra = '') => `<g transform="${tr}" ${extra}>${s}</g>`, esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
const shake = (t, a, f = 23) => [a * (Math.sin(t * f) + .5 * Math.sin(t * f * 2.3 + 1)), a * (Math.cos(t * f * 1.1) + .5 * Math.sin(t * f * 1.9))];
// timeline
const SEG = Object.fromEntries(TL.segments.map(s => [s.id, s]));
const norm = w => w.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]/g, '');
function wt(id, needle, n = 0) { const k = norm(needle), h = SEG[id].words.filter(w => norm(w.w).startsWith(k)); if (!h.length) throw new Error(`"${needle}" não está em ${id}`); return h[Math.min(n, h.length - 1)].s; }
const S = id => SEG[id].s, Ee = id => SEG[id].e, KEY = new Set(TL.keywords.map(norm));
const SFX = []; const sfx = (k, t, d = 0, extra = {}) => SFX.push({ k, t: +t.toFixed(3), d: +(+d).toFixed(3), ...extra });
const RED = '#c0281f', PAPER = '#e9dfc6', INKT = '#1d1a17';

// ═════════════ fotos (dimensões dos arquivos tratados) ═════════════
const PH = { ff3: [960, 1158], apis: [800, 1152], arrival: [800, 650], behr: [1600, 1026], cabrinovic: [306, 434], couple: [1280, 832], crowd: [1600, 1136], family: [1600, 1942], ff: [960, 1280], latin: [1600, 956], mobil: [1600, 2054], nicholas: [500, 528], nyt: [1600, 1180], petitjournal: [1600, 2362], princip: [969, 1212], routemap: [1600, 1072], telegram: [668, 1000], trench: [1300, 950], trench2: [1600, 1150], trial: [1600, 1042], wilhelm: [1600, 2304] };
const imgURL = n => `photos/${n}.jpg`;

// ═════════════ SVG: defs ═════════════
function grainURL(seed) { const c = document.createElement('canvas'); c.width = 360; c.height = 640; const x = c.getContext('2d'), d = x.createImageData(360, 640); let s = seed * 9973 + 1; for (let i = 0; i < d.data.length; i += 4) { s = (s * 16807) % 2147483647; d.data[i] = d.data[i + 1] = d.data[i + 2] = s % 255; d.data[i + 3] = 255; } x.putImageData(d, 0, 0); return c.toDataURL('image/png'); }
const GRAIN = [0, 1, 2, 3, 4, 5].map(grainURL);
const DEFS = `<defs>
<filter id="bgblur" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="28"/></filter>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".75"/></filter>
<filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="ink" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter>
<filter id="whip" x="-20%" y="0" width="140%" height="100%"><feGaussianBlur stdDeviation="38 0"/></filter>
<filter id="redtint"><feColorMatrix type="matrix" values="1.1 .3 .1 0 .05  .1 .3 .1 0 0  .05 .15 .2 0 0  0 0 0 1 0"/></filter>
<radialGradient id="vig" cx="50%" cy="48%" r="72%"><stop offset=".38" stop-color="#000" stop-opacity="0"/><stop offset=".78" stop-color="#000" stop-opacity=".72"/><stop offset="1" stop-color="#000" stop-opacity=".97"/></radialGradient>
<linearGradient id="vigTB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".85"/><stop offset=".14" stop-color="#000" stop-opacity="0"/><stop offset=".82" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".9"/></linearGradient>
<radialGradient id="leak"><stop offset="0" stop-color="#ff9a4a" stop-opacity=".9"/><stop offset="1" stop-color="#ff5a1c" stop-opacity="0"/></radialGradient>
<radialGradient id="flash"><stop offset="0" stop-color="#fff6e0" stop-opacity="1"/><stop offset="1" stop-color="#ffd8a0" stop-opacity="0"/></radialGradient>
</defs>`;

// ═════════════ Ken Burns: foto com fundo desfocado preenchendo a tela vertical ═════════════
// keys: [[lt, fx, fy, zoom]] — (fx,fy) ponto da foto (0..1) no centro da tela; zoom 1 = foto com a largura da tela
function kbXform(name, lt, keys, cy = 900) { const [iw, ih] = PH[name], [fx, fy, z] = kf(lt, keys.map(k => [k[0], [k[1], k[2], k[3]], k[4]])), W = 1080 * z, H = W * ih / iw; return { x: 540 - fx * W, y: cy - fy * H, W, H, iw, ih, z }; }
const toScr = (X, px, py) => [X.x + px / X.iw * X.W, X.y + py / X.ih * X.H];
function kbPhoto(name, X, opts = {}) {
  const [iw, ih] = PH[name], cs = Math.max(1080 / iw, 1920 / ih) * 1.15, bw = iw * cs, bh = ih * cs;
  let s = `<rect width="1080" height="1920" fill="#0b0907"/>`;
  if (opts.bg !== false) s += `<image href="${imgURL(name)}" x="${f1(540 - bw / 2)}" y="${f1(960 - bh / 2)}" width="${f1(bw)}" height="${f1(bh)}" preserveAspectRatio="none" filter="url(#bgblur)" opacity=".42"/>`;
  s += `<image href="${imgURL(name)}" x="${f1(X.x)}" y="${f1(X.y)}" width="${f1(X.W)}" height="${f1(X.H)}" preserveAspectRatio="none" ${opts.filter ? `filter="url(#${opts.filter})"` : ''}/>`;
  return s;
}
// anotações em vermelho (caneta), desenhadas progressivamente
function wobbleEllipse(cx, cy, rx, ry, seed) { let d = ''; const n = 40; for (let i = 0; i <= n + 4; i++) { const a = i / n * Math.PI * 2 - .6, w = 1 + .05 * Math.sin(i * .9 + seed) + .03 * rnd(i + seed); d += (i ? 'L' : 'M') + f1(cx + rx * w * Math.cos(a)) + ' ' + f1(cy + ry * w * Math.sin(a)); } return d; }
const pen = (d, p, w = 9, col = RED, op = 1) => p <= 0 ? '' : `<path d="${d}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="${p.toFixed(3)} 2" opacity="${op}" filter="url(#ink)"/>`;
function redCircle(cx, cy, rx, ry, t, t0, d = .55, seed = 1) { return pen(wobbleEllipse(cx, cy, rx, ry, seed), E.out(prog(t, t0, d))); }
function redX(cx, cy, r, t, t0) { const p1 = E.out(prog(t, t0, .25)), p2 = E.out(prog(t, t0 + .2, .25)); return pen(`M${cx - r} ${cy - r} L${cx + r} ${cy + r}`, p1, 12) + pen(`M${cx + r} ${cy - r} L${cx - r} ${cy + r}`, p2, 12); }
// recorte de papel datilografado (com fita adesiva); as letras aparecem como numa máquina
function note(lines, x, y, t, t0, opts = {}) {
  if (t < t0) return '';
  const size = opts.size || 40, rot = opts.rot ?? -2, cps = opts.cps || 26, w = Math.max(...lines.map(l => l.length)) * size * .62 + 70, h = lines.length * size * 1.25 + 46;
  const s = popS(t, t0, .25); let left = Math.floor((t - t0) * cps), tx = '';
  lines.forEach((l, i) => { const n = clamp(left, 0, l.length); left -= l.length; tx += `<text x="${f1(-w / 2 + 34)}" y="${f1(-h / 2 + 30 + size * (.95 + i * 1.25))}" font-family="TYPE" font-size="${size}" fill="${opts.red && i === 0 ? RED : INKT}">${esc(l.slice(0, n))}</text>`; });
  return g(`translate(${f1(x)},${f1(y)}) rotate(${rot}) scale(${s.toFixed(3)})`, `<rect x="${f1(-w / 2)}" y="${f1(-h / 2)}" width="${f1(w)}" height="${f1(h)}" fill="${PAPER}" filter="url(#shadow)"/>` +
    `<rect x="-60" y="${f1(-h / 2 - 18)}" width="120" height="34" fill="#d8cfa8" opacity=".75" transform="rotate(${rot > 0 ? -4 : 4})"/>` + tx);
}
function stamp(text, x, y, t, t0, opts = {}) {
  if (t < t0) return ''; const p = prog(t, t0, .18), sc = lerp(1.6, 1, E.out(p)), size = opts.size || 64, w = text.length * size * .66 + 60;
  return g(`translate(${f1(x)},${f1(y)}) rotate(${opts.rot ?? -8}) scale(${sc.toFixed(3)})`, `<g filter="url(#ink)" opacity="${(.92 * p).toFixed(2)}"><rect x="${f1(-w / 2)}" y="${-size * .85}" width="${f1(w)}" height="${size * 1.45}" fill="none" stroke="${RED}" stroke-width="7"/><text x="0" y="${size * .3}" text-anchor="middle" font-family="TYPE" font-size="${size}" fill="${RED}" letter-spacing="3">${esc(text)}</text></g>`);
}
function typed(text, x, y, t, t0, size = 64, cps = 18, col = '#e9dfc6', anchor = 'middle') {
  if (t < t0) return ''; const n = Math.floor((t - t0) * cps), cur = (Math.floor(t * 2.2) % 2 && n < text.length + 8) ? '▌' : '';
  return `<text x="${x}" y="${y}" text-anchor="${anchor}" font-family="TYPE" font-size="${size}" fill="${col}" letter-spacing="2">${esc(text.slice(0, n))}${cur}</text>`;
}
// legenda karaokê
const CHUNKS = []; for (const s of TL.segments) { let cur = []; s.words.forEach((w, i) => { cur.push(w); if (/[.,:?]$/.test(w.w) && cur.length >= 3 || cur.length >= 5 || i === s.words.length - 1) { CHUNKS.push({ seg: s.id, words: cur }); cur = []; } }); }
for (let i = CHUNKS.length - 1; i > 0; i--) if (CHUNKS[i].words.length <= 2 && CHUNKS[i - 1].seg === CHUNKS[i].seg && CHUNKS[i - 1].words.length <= 5) { CHUNKS[i - 1].words.push(...CHUNKS[i].words); CHUNKS.splice(i, 1); }
function subtitle(t) {
  let c = null; for (let i = 0; i < CHUNKS.length; i++) { const st = CHUNKS[i].words[0].s - .08, nx = CHUNKS[i + 1] ? CHUNKS[i + 1].words[0].s - .08 : 1e9, en = CHUNKS[i].words[CHUNKS[i].words.length - 1].e + .6; if (t >= st && t < Math.min(nx, en)) { c = CHUNKS[i]; break; } }
  if (!c) return '';
  return `<text x="540" y="1520" text-anchor="middle" font-family="EBG" font-size="56" filter="url(#shadow)">${c.words.map(w => { const on = t >= w.s, k = KEY.has(norm(w.w)); return `<tspan fill="${on && k ? '#e8483c' : '#f3eee2'}" fill-opacity="${on ? 1 : .38}">${esc(w.w)} </tspan>`; }).join('')}</text>`;
}
// ═════════════ pós: borda escura, granulado, cintilação, poeira, riscos, vazamento de luz ═════════════
function post(t) {
  const fr = Math.floor(t * 25); let s = `<rect width="1080" height="1920" fill="url(#vig)"/><rect width="1080" height="1920" fill="url(#vigTB)"/>`;
  s += `<image href="${GRAIN[fr % 6]}" x="0" y="0" width="1080" height="1920" preserveAspectRatio="none" opacity=".11" style="mix-blend-mode:overlay"/>`;
  const fl = .04 + .05 * rnd(fr * 3.1) + (rnd(fr * 7.7) > .97 ? .12 : 0); s += `<rect width="1080" height="1920" fill="#000" opacity="${fl.toFixed(3)}"/>`;
  for (let i = 0; i < 7; i++) { const r = rnd(fr * 13 + i); if (r > .55) s += `<circle cx="${f1(rnd(fr * 5 + i * 3) * 1080)}" cy="${f1(rnd(fr * 9 + i * 7) * 1920)}" r="${f1(1 + rnd(fr + i) * 4)}" fill="${r > .85 ? '#f4ead0' : '#120d08'}" opacity=".7"/>`; }
  if (rnd(fr * 2.3) > .6) { const x = rnd(Math.floor(t * 3)) * 1080; s += `<rect x="${f1(x)}" y="0" width="${f1(1 + rnd(fr) * 2)}" height="1920" fill="#e8dfc8" opacity="${(.15 + .2 * rnd(fr * 4)).toFixed(2)}"/>`; }
  if (rnd(fr * 5.9) > .985) s += `<path d="M${f1(rnd(fr) * 1080)} ${f1(rnd(fr * 2) * 1920)} q40 30 20 90 q-20 50 30 100" stroke="#120d08" stroke-width="2.5" fill="none" opacity=".8"/>`;
  const lk = .08 + .06 * Math.sin(t * .37); s += `<circle cx="${f1(1080 + 120 * Math.sin(t * .21))}" cy="${f1(300 + 200 * Math.sin(t * .13))}" r="700" fill="url(#leak)" opacity="${lk.toFixed(3)}" style="mix-blend-mode:screen"/>`;
  return s;
}

// ═════════════ PAREDE DE INVESTIGAÇÃO (three.js) ═════════════
const canvas = document.getElementById('gl');
const R = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true }); R.setPixelRatio(1); R.setSize(1080, 1920, false);
R.shadowMap.enabled = true; R.shadowMap.type = THREE.PCFSoftShadowMap; R.outputEncoding = THREE.sRGBEncoding;
const ctex = (w, h, draw) => { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 8; return t; };
const WALL = {};
function buildWall(tex) {
  const sc = new THREE.Scene(); sc.background = new THREE.Color(0x050403);
  const cork = ctex(1024, 1536, (x, w, h) => { x.fillStyle = '#7a5434'; x.fillRect(0, 0, w, h); for (let i = 0; i < 26000; i++) { const r = rnd(i); x.fillStyle = r > .5 ? `rgba(150,105,62,${(.3 + rnd(i * 3) * .5).toFixed(2)})` : `rgba(55,34,20,${(.3 + rnd(i * 5) * .5).toFixed(2)})`; x.fillRect(rnd(i * 7) * w, rnd(i * 11) * h, 1 + rnd(i * 13) * 4, 1 + rnd(i * 17) * 4); } for (let i = 0; i < 60; i++) { x.fillStyle = 'rgba(30,18,10,.5)'; x.beginPath(); x.arc(rnd(i * 19) * w, rnd(i * 23) * h, 2, 0, 7); x.fill(); } });
  const board = new THREE.Mesh(new THREE.PlaneGeometry(28, 42), new THREE.MeshStandardMaterial({ map: cork, roughness: .95 })); board.receiveShadow = true; sc.add(board);
  const wood = new THREE.MeshStandardMaterial({ color: 0x3a2414, roughness: .7 });
  for (const [w, h, x, y] of [[29.6, .8, 0, 21.2], [29.6, .8, 0, -21.2], [.8, 43.2, 14.4, 0], [.8, 43.2, -14.4, 0]]) { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, .7), wood); m.position.set(x, y, .2); m.castShadow = true; sc.add(m); }
  const wallBg = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({ color: 0x1c1712, roughness: 1 })); wallBg.position.z = -.3; wallBg.receiveShadow = true; sc.add(wallBg);
  sc.add(new THREE.AmbientLight(0xffe2c0, .10));
  const fill = new THREE.DirectionalLight(0xffd9a8, .18); fill.position.set(-10, 20, 30); sc.add(fill);
  const spot = new THREE.SpotLight(0xfff0d6, 3.2, 0, .32, .65, 1.2); spot.castShadow = true; spot.shadow.mapSize.set(1024, 1024); spot.shadow.bias = -.0004; sc.add(spot, spot.target);
  const items = {}, pinMat = new THREE.MeshPhongMaterial({ color: 0xc0281f, shininess: 90, specular: 0xffffff });
  const pinAt = (p, z = .12) => { const g2 = new THREE.Group(); const head = new THREE.Mesh(new THREE.SphereGeometry(.22, 16, 12), pinMat); head.position.z = .32; head.castShadow = true; const nd = new THREE.Mesh(new THREE.CylinderGeometry(.03, .03, .4, 6).rotateX(Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0xbbbbbb, metalness: .8, roughness: .3 })); nd.position.z = .15; g2.add(head, nd); g2.position.set(p[0], p[1], z); return g2; };
  function addPhoto(id, name, x, y, w, rot = 0, t0 = 0) {
    const [iw, ih] = PH[name], h = w * ih / iw, gp = new THREE.Group(); gp.position.set(x, y, .06); gp.rotation.z = rot;
    const border = new THREE.Mesh(new THREE.PlaneGeometry(w + .5, h + .5), new THREE.MeshStandardMaterial({ color: 0xece4d0, roughness: .8 })); border.castShadow = border.receiveShadow = true; gp.add(border);
    const ph = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshStandardMaterial({ map: tex[name], roughness: .55 })); ph.position.z = .01; ph.receiveShadow = true; gp.add(ph);
    const pin = pinAt([0, h / 2 - .1], .02); gp.add(pin);
    sc.add(gp); items[id] = { g: gp, pin: () => gp.localToWorld(new THREE.Vector3(0, h / 2 - .1, .34)), w, h, t0 }; return items[id];
  }
  function addCard(id, lines, x, y, rot = 0, t0 = 0, opts = {}) {
    const fs = opts.fs || 64, lw = Math.max(...lines.map(l => l.length)) * fs * .62 + 90, lh = lines.length * fs * 1.3 + 60;
    const tx = ctex(Math.ceil(lw), Math.ceil(lh), (x2, w, h) => { x2.fillStyle = '#e9dfc6'; x2.fillRect(0, 0, w, h); for (let i = 0; i < 600; i++) { x2.fillStyle = `rgba(90,70,40,${(rnd(i) * .12).toFixed(2)})`; x2.fillRect(rnd(i * 3) * w, rnd(i * 5) * h, 3, 3); } x2.font = `${fs}px TYPE`; x2.fillStyle = '#1d1a17'; lines.forEach((l, i) => { x2.fillStyle = opts.red && i === 0 ? '#b0241c' : '#1d1a17'; x2.fillText(l, 45, 30 + fs * (1 + i * 1.3)); }); });
    const w = lw / 120, h = lh / 120, gp = new THREE.Group(); gp.position.set(x, y, .07); gp.rotation.z = rot;
    const mat = new THREE.MeshStandardMaterial({ map: tx, roughness: .9 }); const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat); m.castShadow = m.receiveShadow = true; gp.add(m);
    gp.add(pinAt([0, h / 2 - .2], .02)); sc.add(gp);
    items[id] = { g: gp, mat, pin: () => gp.localToWorld(new THREE.Vector3(0, h / 2 - .2, .34)), w, h, t0 }; return items[id];
  }
  function addMark(id, onId, kind, t0, opts = {}) { // marca de caneta vermelha sobre um item (X, círculo, "?")
    const it = items[onId], tx = ctex(512, 512, (x, w, h) => { x.strokeStyle = '#c0281f'; x.lineWidth = 26; x.lineCap = 'round'; x.globalAlpha = .9;
      if (kind === 'x') { x.beginPath(); x.moveTo(80, 80); x.lineTo(430, 440); x.moveTo(440, 70); x.lineTo(70, 430); x.stroke(); }
      if (kind === 'circle') { x.beginPath(); x.ellipse(256, 256, 210, 190, -.2, 0, Math.PI * 2.05); x.stroke(); }
      if (kind === 'q') { x.font = 'bold 420px TYPE'; x.fillStyle = '#c0281f'; x.textAlign = 'center'; x.fillText('?', 256, 420); } });
    const m = new THREE.Mesh(new THREE.PlaneGeometry(opts.s || it.w * .8, opts.s || it.w * .8), new THREE.MeshBasicMaterial({ map: tx, transparent: true, opacity: 0, depthWrite: false }));
    m.position.set(opts.x || 0, opts.y || 0, .03); it.g.add(m); items[id] = { mark: m, t0 }; }
  const strings = [];
  function addString(a, b, t0, dur = .7, sag = .9) {
    const A = items[a].pin(), B = items[b].pin(), mid = A.clone().add(B).multiplyScalar(.5); mid.y -= sag; mid.z += .1;
    const geo = new THREE.TubeGeometry(new THREE.QuadraticBezierCurve3(A, mid, B), 48, .045, 6, false);
    const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: 0xa3141c, roughness: .6 })); m.castShadow = true; sc.add(m);
    strings.push({ m, t0, dur, n: geo.index.count }); }
  // ─ composição da parede ─
  addPhoto('ff', 'ff', -7.5, 14.5, 6, .03); addPhoto('couple', 'couple', 5.5, 15.5, 8.5, -.04);
  addCard('alvo', ['ALVO:', 'ARQUIDUQUE', 'F. FERDINANDO'], -7.8, 7.6, .04, 0, { red: true });

const svg = document.getElementById('v');
function renderAt(t) {
  let sh = SH[0]; for (const s of SH) if (t >= s.t0) sh = s;
  const lt = t - sh.t0, wall = sh.name.startsWith('parede') || sh.name === 'pergunta';
  canvas.style.visibility = wall ? 'visible' : 'hidden';
  const wp = clamp(lt / .16), dir = (SH.indexOf(sh) % 2 ? 1 : -1);
  let body = sh.f(lt, t);
  if (sh.t0 > 0 && wp < 1 && !wall) body = `<g transform="translate(${f1(dir * 140 * Math.pow(1 - wp, 2))},0)" filter="url(#whip)" opacity="${(.6 + .4 * wp).toFixed(2)}">${body}</g>`;
  canvas.style.filter = wall && sh.t0 > 0 && wp < 1 ? `blur(${f1(10 * (1 - wp))}px)` : 'none';
  canvas.style.transform = wall && sh.t0 > 0 && wp < 1 ? `translateX(${f1(dir * 120 * Math.pow(1 - wp, 2))}px)` : 'none';
  let out = DEFS + body;
  out += post(t) + subtitle(t);
  const fin = Math.min(prog(t, 0, 1.2), 1 - prog(t, TL.duration - 2.2, 2.2)); if (fin < 1) out += `<rect width="1080" height="1920" fill="#000" opacity="${(1 - fin).toFixed(3)}"/>`;
  svg.innerHTML = out;
}
