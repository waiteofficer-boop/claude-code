function placeBill(b,p,k,i,spin){b.visible=true;b.position.copy(p);b.rotation.set(Math.sin(k*6+i)*.4,spin+k*3,Math.cos(k*5+i)*.3)}
function flowState(mode,lt){ // mode: 'hoje'|'split'|'loop'
  const n=13,taxN=3;
  bills.forEach(b=>b.visible=false);
  if(mode==='hoje'){ // all to store via bank (no split), then later 3 go store->gov
    for(let i=0;i<n;i++){const t0=.4+i*.12,u=clamp((lt-t0)/1.1);const b=bills[i];b.material.map=BG;
      if(lt<t0){b.visible=false;continue}
      if(u<1){placeBill(b,segCS(ease(u)),u,i,i)}else{const k=i;b.visible=true;b.position.copy(P.store).add(new THREE.Vector3((k%3-1)*.05,-.5+k*.028,0));b.rotation.set(0,.3,0)}}
    // later: 3 taxes leave store -> gov
    for(let j=0;j<taxN;j++){const i=n-1-j;const t0=3.0+j*.3,u=clamp((lt-t0)/1.3);if(lt>t0){const b=bills[i];b.material.map=BY;if(u<1)placeBill(b,segSG(ease(u)),u,i,i);else{b.position.copy(P.gov).add(new THREE.Vector3(j*.06,-1.0+j*.03,0));b.rotation.set(0,0,0)}}}
    return}
  // split: customer -> bank, at bank: first taxN become yellow -> gov ; rest green -> store
  for(let i=0;i<n;i++){const isTax=i<taxN;const t0=.3+i*.16;const b=bills[i];if(lt<t0)continue;
    const u1=clamp((lt-t0)/.9);if(u1<1){b.material.map=BG;placeBill(b,segCB(ease(u1)),u1,i,i);continue}
    const u2=clamp((lt-t0-.9-.15)/1.0);if(u2<=0){b.visible=true;b.position.copy(P.bankIn);b.material.map=isTax?BY:BG;continue}
    b.material.map=isTax?BY:BG;
    if(u2<1){placeBill(b,(isTax?segBG:segBS)(ease(u2)),u2,i,i);continue}
    b.visible=true;const k=isTax?i:i-taxN;b.position.copy(isTax?P.gov:P.store).add(new THREE.Vector3((k%3-1)*.05,(isTax?-1.0:-.5)+k*.028,0));b.rotation.set(0,.3,0)}
}

   case 7: h+=head(v,s,'Pra quem compra',on(v,E.quem)?`Quem paga<br>é <span class="y">você</span>`:`Parece que<br><span class="y">nada muda</span>`,36);
     {const k=fade(v,E.embutido,.6);h+=card(v,s,`<div class="lab"><span>Etiqueta de preço</span><span>exemplo</span></div><div class="row"><span>Preço</span><span class="big">R$ 1.265</span></div><div style="opacity:${k}"><div class="row" style="font-size:13px"><span>produto</span><span style="font-family:AB">R$ 1.000</span></div><div class="row" style="font-size:13px;color:#a87f00"><span>imposto embutido</span><span style="font-family:AB">R$ 265</span></div></div>`,.4)}
     if(on(v,E.quem))h+=`<div class="stamp red" style="left:280px;top:470px;${slam(v,E.quem,-5)}">é você</div>`;break;
   case 8: h+=head(v,s,'Pra quem vende',on(v,E.credito)?`E o <span class="y">crédito</span>?`:`O caixa <span class="y">encolhe</span>`,40);
     if(!on(v,E.credito)){const k=fade(v,E.caixa,1);h+=card(v,s,`<div class="lab"><span>Entra no caixa</span><span>venda R$ 1.265</span></div><div class="row"><span>Hoje</span><span class="big">R$ 1.265</span></div><div class="bar"><i style="width:100%;background:#9aa3c8"></i></div><div class="row" style="margin-top:8px"><span>Com split</span><span class="big" style="color:var(--grn)">${brl2(1265-265*k)}</span></div><div class="bar"><i style="width:${100-21*k}%;background:#3EDC81"></i></div>`,.3)}
     else{const k=clamp((v-E.credito)/1.5);const stuck=on(v,E.demorar);h+=card(v,{a:E.credito},`<div class="lab"><span>Crédito das compras</span><span>${stuck?'aguardando':'a receber'}</span></div><div class="row"><span>Imposto pago nas compras</span><span class="box y" style="padding:3px 8px">vira crédito</span></div><div class="bar"><i style="width:${stuck?38+Math.sin(v*6)*2:38*k}%;background:var(--blue)"></i></div><div class="row" style="font-size:13px;color:${stuck?'var(--red)':'var(--mut)'}"><span>${stuck?'se demorar…':'devolução do crédito'}</span><span>${on(v,E.parado)?'parado com o governo':''}</span></div>`,.2)}
     if(on(v,E.parado))h+=`<div class="stamp red" style="left:200px;top:470px;${slam(v,E.parado,-4)}">dinheiro parado</div>`;break;
   case 9: h+=head(v,s,'Cronograma',`Quando <span class="y">começa</span>`,40);
     {const rows=[['Testes da plataforma','out/2026',E.outubro],['Opcional · entre empresas · CBS','2027',E.y2027],['IBS e vendas ao consumidor','depois',E.depois]];
      h+=card(v,s,`<div class="lab"><span>Cronograma</span><span>pode mudar</span></div>`+rows.map(r=>`<div class="row" style="opacity:${on(v,r[2])?1:.25}"><span style="font-size:14px">${on(v,r[2])?'●':'○'} ${r[0]}</span><span class="big" style="font-size:18px;color:var(--blue)">${r[1]}</span></div>`).join(''),.3)}break;
   case 10: h+=head(v,s,'Tem empresa?',`Se prepara <span class="y">agora</span>`,40);
     if(on(v,E.salva-.1))h+=card(v,{a:E.salva-.1},`<div style="display:grid;gap:10px"><div class="btnx" style="${ap(v,E.salva)}">▼ Salvar esse vídeo</div><div class="btnx" style="background:var(--y);${ap(v,E.salva+.6)}">➜ Mandar pro contador</div></div>`,0);break;
  }
  // tiny white flash on internal cuts
  if(cut>0)h+=`<div style="position:absolute;left:40px;top:208px;width:478px;height:348px;background:#fff;opacity:${cut*.5};transform:${photo.style.transform}"></div>`;
  ovEl.innerHTML=h;return {shot:s.id}};
window.DUR=DUR2;window.__ready=true;
</script></body></html>
